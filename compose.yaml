# Dev dependencies for the Spring Boot app (Postgres + observability).
#
# This file is consumed by Spring Boot's `spring.docker.compose`
# auto-detection (which only looks at `compose.yaml` / `compose.yml` /
# `docker-compose.yaml` / `docker-compose.yml` in the project root) and
# can also be started manually with `docker compose up` for non-dev-
# container workflows.
#
# It intentionally does NOT define the dev container `service` — that
# lives in `compose.devcontainer.yaml`, referenced by
# `.devcontainer/devcontainer.json`. Keeping the two files separate
# prevents the dev container and Spring Boot from fighting over the
# same `service` container.

services:

  chat_memory_db:
    image: pgvector/pgvector:pg16
    container_name: chat_memory_db
    labels:
      - "org.springframework.boot.service-connection=postgres"
    environment:
      TZ: "America/Mexico_City"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_memory_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_HOST: chat_memory_db
      DB_PORT: 5432
    ports:
      - "5432:5432"
  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'
      - '4317'
      - '4318'