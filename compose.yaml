# Dev dependencies for the Spring Boot app.
#
# This file is consumed by Spring Boot's `spring.docker.compose`
# auto-detection (which only looks at `compose.yaml` / `compose.yml` /
# `docker-compose.yaml` / `docker-compose.yml` in the project root) and
# can also be started manually with `docker compose up` for non-dev-
# container workflows.
#
# It is the ORCHESTRATOR of the dev stack: it owns the shared
# `simplechat-net` Docker network, keeps the app's own DB inline, and
# `include:`s the per-tool compose files under `infra/`. The root file
# is intentionally small (Spring Boot only auto-detects the root) while
# each tool evolves independently under its own folder — the same
# layout maps 1:1 onto future k8s manifests.
#
# Per-tool stacks:
#   infra/lgtm/                          - Grafana OTel LGTM (started here)
#   infra/observability/otel-collector/  - OTel fan-out (started here)
#   infra/langfuse/                      - Langfuse LLM tracing (manual, opt-in)
#
# Spring Boot's `spring.docker.compose` integration will pull up the
# full auto-included graph (lgtm + collector) on `./mvnw spring-boot:run`.
# Langfuse must be started separately; see `infra/langfuse/compose.yaml`.

name: simplechat

networks:
  simplechat-net:
    name: simplechat-net

services:

  chat_memory_db:
    image: pgvector/pgvector:pg16
    container_name: chat_memory_db
    labels:
      - "org.springframework.boot.service-connection=postgres"
    environment:
      TZ: "America/Mexico_City"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_memory_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_HOST: chat_memory_db
      DB_PORT: 5432
    ports:
      - "5432:5432"
    networks:
      - simplechat-net

include:
  - path: ./infra/lgtm/compose.yaml
  - path: ./infra/observability/otel-collector/compose.yaml