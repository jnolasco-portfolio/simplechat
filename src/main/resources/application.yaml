server:
  port: 8082

spring:
  config:
    import: 'optional:file:./.env[.properties]'
  application:
    name: simplechat
  ai:
    model:
      audio:
        speech: disabled
        transcription: disabled
    openai:
      timeout: 350s
      base-url: ${BASE_URL} #'http://host.docker.internal:11434/v1'
      api-key: '${OPENAI_API_KEY}'
      chat:
        model: ${CHAT_MODEL}
        #'granite4:7b-a1b-h'
      embedding:
        model: ${EMBEDDING_MODEL}
        #mxbai-embed-large
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
        initialize-schema: false

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
      observations:
        log-prompt: true
        log-completion: true
        include-error-logging: true
    tools:
      throw-exception-on-error: true
      observations:
        include-content: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # Spring Boot Docker Compose dev-time support: auto-detects compose.yaml,
  # starts it on app start, stops it on shutdown. JdbcConnectionDetails is
  # auto-wired from the running Postgres container (no manual datasource in dev).
  # In tests compose is skipped by default (skip.in-tests defaults to true).
  docker:
    compose:
      # --wait blocks until Postgres is healthy; --remove-orphans cleans up
      # containers from previous runs whose services are no longer in the file.
      start:
        arguments:
          - --wait
          - --remove-orphans
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs

# Logging Configuration
logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: DEBUG
    org.springframework.ai: DEBUG
