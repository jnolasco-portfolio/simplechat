databaseChangeLog:
  - changeSet:
      id: '1.0'
      author: jnolasco
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: SPRING_AI_CHAT_MEMORY
      changes:
        - createTable:
            tableName: SPRING_AI_CHAT_MEMORY
            columns:
              - column:
                  name: conversation_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: '1.1'
      author: jnolasco
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT COUNT(*) FROM information_schema.constraint_column_usage
              WHERE table_name='SPRING_AI_CHAT_MEMORY' AND constraint_name='SPRING_AI_CHAT_MEMORY_TYPE_CHECK'
      changes:
        - sql:
            sql: |
              ALTER TABLE SPRING_AI_CHAT_MEMORY
              ADD CONSTRAINT SPRING_AI_CHAT_MEMORY_TYPE_CHECK
              CHECK (type IN ('USER','ASSISTANT','SYSTEM','TOOL'));

  - changeSet:
      id: '1.2'
      author: jnolasco
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: SPRING_AI_CHAT_MEMORY_CONVERSATION_ID_TIMESTAMP_IDX
      changes:
        - createIndex:
            indexName: SPRING_AI_CHAT_MEMORY_CONVERSATION_ID_TIMESTAMP_IDX
            tableName: SPRING_AI_CHAT_MEMORY
            columns:
              - column:
                  name: conversation_id
              - column:
                  name: timestamp

  - changeSet:
      id: '1.3'
      author: jnolasco
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT COUNT(*) FROM pg_extension WHERE extname='vector'
      changes:
        - sql:
            sql: |
              CREATE EXTENSION IF NOT EXISTS vector;
              CREATE EXTENSION IF NOT EXISTS hstore;
              CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

  - changeSet:
      id: '1.4'
      author: jnolasco
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: vector_store
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS vector_store (
                id uuid DEFAULT uuid_generate_v4() PRIMARY KEY,
                content text,
                metadata json,
                embedding vector(1024)
              );

  - changeSet:
      id: '1.5'
      author: jnolasco
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: vector_store_embedding_idx
      changes:
        - sql:
            sql: |
              CREATE INDEX ON vector_store USING HNSW (embedding vector_cosine_ops);
