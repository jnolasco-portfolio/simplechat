# Grafana OTel LGTM stack for dev.
#
# Started by the root [`compose.yaml`](../../compose.yaml) via `include:` on
# `./mvnw spring-boot:run`. Brings up the LGTM containers on the shared
# `simplechat-net` network so the OTel collector in
# `infra/observability/otel-collector/` can forward traces, metrics, and
# logs to it.
#
# Port allocation:
#   - 3002 -> 3000   (Grafana UI; 3000 is reserved for langfuse-web)
#   - 4317/4318 on the internal network only — the OTel collector owns the
#     host ports 4317/4318 now and forwards into grafana-lgtm:4318.

services:

  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    labels:
      # Opt out of Spring Boot 4.1.0's new OpenTelemetry Docker
      # service-connection factories (metrics, tracing, logging). They
      # match the `grafana/otel-lgtm` image by name and call
      # `ports.get(4318)` on it, which fails with
      # "No host port mapping found for container port 4318" because
      # this image's only host-mapped port is 3002:3000 (Grafana UI).
      # See Spring Boot 4.1.0 reference, "Docker Compose > Skipping
      # Specific Containers". We want to keep using our explicit
      # `management.otlp.*.export.url` properties in `application.yaml`
      # which point at the otel-collector fan-out hub, not at this image.
      org.springframework.boot.ignore: "true"
    ports:
      - "3002:3000"
    networks:
      - simplechat-net

networks:
  simplechat-net:
    # Pinned name so this file works in both modes:
    #   - included from the root `compose.yaml` — the root creates the
    #     network first, lgtm just joins it via the pinned name.
    #   - standalone (`docker compose -f infra/lgtm/compose.yaml up`)
    #     — Compose creates a `simplechat-net` network on the fly.
    # No `external: true` here on purpose: with `external: true` the
    # merge with the root flips the network to external and Spring Boot's
    # `spring.docker.compose` fails with
    # "network simplechat-net declared as external, but could not be found".
    name: simplechat-net
